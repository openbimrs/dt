[package]
name = "openbim-dt"
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/dt"
homepage = "https://openbimrs.github.io/dt/"
documentation = "https://docs.rs/openbim-dt"
readme = "README.md"
description = "Lossless ISO 23387 data-template model and XML codec for Rust."
keywords = ["bim", "openbim", "ifc", "data-template"]
categories = ["data-structures"]
exclude = ["AGENTS.md", "PLAN.md"]

[[bin]]
name = "openbim-dt"
path = "src/main.rs"

[dependencies]
quick-xml = { version = "0.41.0", default-features = false }
roxmltree = { version = "0.21.1", default-features = false, features = ["std", "positions"] }

# `getrandom` is used only by the `openbim-dt` binary, for the OS-random
# temporary-file token in `atomic_replace`. As a plain dependency it was
# forced on every library consumer and broke `wasm32-unknown-unknown`
# outright. Scoping it to non-wasm targets frees library consumers without
# touching native builds, where the CLI still resolves it normally. The
# binary is not buildable for wasm, which is expected: it is a file-writing
# CLI, and dependents compile only the library.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.2.16"
